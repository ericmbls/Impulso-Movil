<ion-content fullscreen>
  <div class="scanner-page">
    <div class="page-header">
      <h1>
        <ion-icon name="scan-outline"></ion-icon>
        Escanear QR
      </h1>

      <p>
        Escanea el código QR del estudiante para registrar su asistencia.
      </p>
    </div>

    <app-scan-frame
      (scan)="onScanSuccess($event)"
      (close)="onScanClose()"
    ></app-scan-frame>
  </div>
</ion-content>

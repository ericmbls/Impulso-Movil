<article class="last-scan-card">
  <div class="card-header">
    <div class="scan-info">
      <div
        class="scan-icon"
        [class.success]="status === 'success'"
        [class.pending]="status === 'pending'"
        [class.error]="status === 'error'">
        <ion-icon
          name="qr-code-outline"
          aria-hidden="true">
        </ion-icon>
      </div>

      <div class="scan-details">
        <span class="scan-label">
          Alumno
        </span>

        <h3 class="student-name">
          {{ studentName || 'Alumno' }}
        </h3>

        <p class="subject">
          {{ subject || 'Materia' }}
        </p>
      </div>
    </div>

    <span
      class="status-badge"
      [class.success]="status === 'success'"
      [class.pending]="status === 'pending'"
      [class.error]="status === 'error'">

      <ion-icon
        [name]="getStatusIcon()"
        aria-hidden="true">
      </ion-icon>

      {{ getStatusText() }}
    </span>
  </div>

  @if (date || time) {
    <footer class="card-footer">
      @if (date) {
        <span class="meta-item">
          <ion-icon
            name="calendar-outline"
            aria-hidden="true">
          </ion-icon>

          {{ date }}
        </span>
      }

      @if (date && time) {
        <span
          class="meta-divider"
          aria-hidden="true">
          •
        </span>
      }

      @if (time) {
        <span class="meta-item">
          <ion-icon
            name="time-outline"
            aria-hidden="true">
          </ion-icon>

          {{ time }}
        </span>
      }
    </footer>
  }
</article>

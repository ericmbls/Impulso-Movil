<div class="scan-frame">
  <div class="frame">
    <div class="scanner" [class.active]="isScanning">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="scan-line" *ngIf="isScanning"></div>

      <ion-icon name="scan-outline" class="scan-icon"></ion-icon>

      <div class="scan-placeholder" *ngIf="scanStatus === 'idle'">
        <p>Apunta la cámara al código QR</p>
      </div>

      <div class="scan-placeholder" *ngIf="scanStatus === 'scanning'">
        <p>Buscando código QR...</p>
      </div>

      <div class="scan-status-overlay" *ngIf="scanStatus === 'success'">
        <ion-icon name="checkmark-circle-outline" class="status-icon success"></ion-icon>
        <p class="status-text">¡Código escaneado con éxito!</p>
      </div>

      <div class="scan-status-overlay" *ngIf="scanStatus === 'error'">
        <ion-icon name="close-circle-outline" class="status-icon error"></ion-icon>
        <p class="status-text">Error al escanear el código</p>
      </div>
    </div>
  </div>

  <div class="scan-footer">
    <button
      class="scan-btn"
      type="button"
      (click)="startScan()"
      [disabled]="scanStatus !== 'idle'">
      <ion-icon name="scan-outline"></ion-icon>
      {{
        scanStatus === 'idle' ? 'Iniciar escaneo' :
        scanStatus === 'scanning' ? 'Escaneando...' :
        scanStatus === 'success' ? '¡Éxito!' :
        'Reintentar'
      }}
    </button>
  </div>
</div>
